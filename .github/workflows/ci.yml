# Runs on every PR so Dependabot's security bumps arrive pre-verified
# instead of sitting unmerged. Before this existed, .github/ held only
# dependabot.yml — nothing checked the PRs it opened, and a batch of
# security updates went stale for three weeks.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Surface new advisories on the same weekly cadence Dependabot runs,
    # so the audit job goes red even in a quiet week with no PRs.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest

    # src/actions/asset-actions.test.ts is an integration test that runs
    # real Prisma queries against seeded data. It self-skips when
    # DATABASE_URL is unset — but the build needs DATABASE_URL to parse, so
    # setting one at job level un-skips the test. Rather than hide it, give
    # CI a real database and let it run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investment_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway service container, torn down with the job. `npm run
      # db:seed` wipes core tables and creates known-password accounts, so
      # this must never point anywhere real.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investment_tracker
      # Build-time placeholders, not secrets. Real values live in Vercel.
      NEXTAUTH_SECRET: ci-build-placeholder-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          # engines: >=20.9.0 <25. Production runs on Vercel; the Dockerfile
          # is still on 20.
          node-version: 22.x
          cache: npm

      # postinstall runs `prisma generate`, which the build depends on.
      - run: npm ci

      - name: Prepare database
        run: |
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Unit + integration tests
        run: npm test

      # The PDF placeholder scanner is the most upgrade-fragile path in the
      # app (pdfjs + a DOM polyfill for the Node runtime) and has broken in
      # production before, so it gets its own check on every PR.
      - name: PDF scanner smoke test
        run: npx tsx scripts/smoke-pdf-scan.ts

      # Also type-checks — `next build` runs tsc as part of the build.
      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      # --ignore-scripts: the audit needs the dependency tree, not a
      # generated Prisma client.
      - run: npm ci --ignore-scripts

      - name: npm audit (high and above)
        run: npm audit --audit-level=high
